<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="SKETCH2SHAPE AI banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1646"/>
      <stop offset="1" stop-color="#2a1458"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- Hand-drawn sketch cube (left) -->
  <g fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.4s" repeatCount="indefinite"/>
    <path d="M230 99 L292 136 L291 206 L231 242 L168 204 L170 134 Z"/>
    <path d="M169 135 L229 171 L292 135"/>
    <path d="M230 171 L231 241"/>
  </g>
  <text x="230" y="285" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#a5b4fc" letter-spacing="3">2D SKETCH</text>

  <!-- Flow arrow -->
  <path d="M310 262 Q600 312 890 262" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M880 250 L896 262 L878 272" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Solid 3D cube (right) -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3.2s" repeatCount="indefinite"/>
    <polygon points="970,100 1031,135 970,170 909,135" fill="url(#top)"/>
    <polygon points="909,135 970,170 970,240 909,205" fill="url(#left)"/>
    <polygon points="1031,135 1031,205 970,240 970,170" fill="url(#right)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4">
      <polygon points="970,100 1031,135 1031,205 970,240 909,205 909,135"/>
      <path d="M909 135 L970 170 L1031 135 M970 170 L970 240"/>
    </g>
  </g>
  <text x="970" y="285" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c4b5fd" letter-spacing="3">3D GLB MESH</text>

  <!-- Title -->
  <text x="600" y="148" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="3">SKETCH2SHAPE AI</text>
  <text x="600" y="190" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#e0e7ff" opacity="0.92">From a simple 2D sketch to a photorealistic 3D reality</text>
  <text x="600" y="228" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#a5b4fc" letter-spacing="4">TECHZEPHYR 4.0  •  IIT BHUBANESWAR</text>
</svg>
